name: Bug report
description: Report a reproducible bug in Rep-Pilot frontend or backend.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - rep-pilot-front
        - rep-pilot-back
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clear and concise description of what happened.
      placeholder: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser, OS, Node version, and any relevant context.
    validations:
      required: false
